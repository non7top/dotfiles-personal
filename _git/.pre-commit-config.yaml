repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v2.3.0
  hooks:
  - id: check-yaml
    args: [--allow-multiple-documents]
    exclude: ^(k8s/deploy/charts|apps/beacon/chart|helm/.+/templates)/|^helmfile\.yaml$
  - id: end-of-file-fixer
    exclude: \.dat$
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
  - id: check-json
- repo: https://github.com/sirosen/texthooks
  rev: 1.0.0
  hooks:
  - id: fix-smartquotes
  - id: fix-spaces
  - id: fix-unicode-dashes
    args:
    - --single-hyphen-codepoints=2010,2011,FE63,2012,2013,2212,02D7,2796,FF0D,2014,FE58
    - --double-hyphen-codepoints=
  - id: fix-ligatures
  - id: forbid-bidi-controls
- repo: https://github.com/gruntwork-io/pre-commit
  rev: v0.1.20
  hooks:
  - id: terraform-fmt
